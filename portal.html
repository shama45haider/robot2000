<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SparksByAura | Client Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Montserrat',sans-serif;
background:radial-gradient(circle at top,#0a0f2c 0%,#050816 40%,#000 100%);
color:white;
min-height:100vh;
}

section{padding:80px 20px}
.container{max-width:1100px;margin:auto}

.section-title{
font-family:'Orbitron';
text-align:center;
font-size:36px;
margin-bottom:25px;
color:#60a5fa;
}

.card{
background:#111c4d;
border:1px solid #1e3a8a;
border-radius:20px;
padding:25px;
}

.services-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:25px;
}

/* LOGIN */

.portal-login{
margin-bottom:25px;
background:#111c4d;
padding:20px;
border-radius:14px;
border:1px solid #1e3a8a;
max-width:420px;
}

.portal-login input{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:1px solid #1e3a8a;
background:#0a0f2c;
color:white;
}

.portal-login button{
width:100%;
padding:10px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
font-weight:600;
cursor:pointer;
}

/* PDF viewer */

.doc-frame{
width:100%;
height:220px;
border-radius:10px;
border:1px solid #1e3a8a;
margin-top:10px;
}

/* SIGNATURE PAD */

.sign-pad{
width:100%;
height:120px;
background:white;
border-radius:10px;
border:1px solid #1e3a8a;
margin-top:12px;
cursor:crosshair;
}

/* BUTTON */

.sign-btn{
margin-top:10px;
padding:10px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
font-weight:600;
cursor:pointer;
width:100%;
}

.sign-btn:disabled{
background:#475569;
cursor:not-allowed;
}

.sign-status{
margin-top:8px;
font-size:13px;
color:#f87171;
}

/* HOME BUTTON */

.home-return{
position:fixed;
bottom:25px;
left:25px;
padding:12px 20px;
border-radius:50px;
background:linear-gradient(90deg,#2563eb,#3b82f6);
color:#fff;
text-decoration:none;
font-weight:600;
box-shadow:0 0 18px rgba(59,130,246,.6);
}

</style>
</head>

<body>

<section class="container">

<h2 class="section-title">Client Documents</h2>

<div class="portal-login">

<input id="clientEmail" placeholder="Username">
<input id="clientPass" type="password" placeholder="Password">

<button onclick="loginClient()">Login to Sign Documents</button>

<p id="loginStatus" style="font-size:12px;margin-top:8px;color:#94a3b8"></p>

<p style="font-size:12px;margin-top:6px;color:#94a3b8">
Demo Login → Username: <b>demo</b> Password: <b>demo</b>
</p>

</div>

<div class="services-grid">

<div class="card doc-card" data-doc="general">

<h3>General Contract</h3>

<input type="file" class="doc-upload" accept="application/pdf">

<iframe class="doc-frame"></iframe>

<canvas class="sign-pad"></canvas>

<button class="sign-btn" disabled>Sign Document</button>

<p class="sign-status">Preview Required</p>

</div>


<div class="card doc-card" data-doc="liability">

<h3>Liability Agreement</h3>

<input type="file" class="doc-upload" accept="application/pdf">

<iframe class="doc-frame"></iframe>

<canvas class="sign-pad"></canvas>

<button class="sign-btn" disabled>Sign Document</button>

<p class="sign-status">Preview Required</p>

</div>


<div class="card doc-card" data-doc="payment">

<h3>Payment Agreement</h3>

<input type="file" class="doc-upload" accept="application/pdf">

<iframe class="doc-frame"></iframe>

<canvas class="sign-pad"></canvas>

<button class="sign-btn" disabled>Sign Document</button>

<p class="sign-status">Preview Required</p>

</div>

</div>

</section>

<a href="index.html" class="home-return">⬅ Return Home</a>

<script>

let portalLoggedIn=false;

/* LOGIN */

function loginClient(){

const email=document.getElementById("clientEmail").value;
const pass=document.getElementById("clientPass").value;

if(email==="demo" && pass==="demo"){

portalLoggedIn=true;

document.getElementById("loginStatus").textContent=
"Login successful. You can now sign documents.";

document.getElementById("loginStatus").style.color="#4ade80";

}else{

portalLoggedIn=false;

document.getElementById("loginStatus").textContent=
"Invalid credentials. Use demo / demo";

document.getElementById("loginStatus").style.color="#f87171";

}

}

/* SIGNATURE PAD */

document.querySelectorAll(".sign-pad").forEach(pad=>{

const ctx=pad.getContext("2d");

let drawing=false;

pad.addEventListener("mousedown",()=>drawing=true);
pad.addEventListener("mouseup",()=>drawing=false);

pad.addEventListener("mousemove",e=>{

if(!drawing) return;

const rect=pad.getBoundingClientRect();

const x=e.clientX-rect.left;
const y=e.clientY-rect.top;

ctx.lineWidth=2;
ctx.lineCap="round";
ctx.strokeStyle="black";

ctx.lineTo(x,y);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(x,y);

});

});

/* DOCUMENT PREVIEW */

document.querySelectorAll(".doc-upload").forEach(upload=>{

upload.addEventListener("change",function(){

const file=this.files[0];

const card=this.closest(".doc-card");

const frame=card.querySelector(".doc-frame");

const btn=card.querySelector(".sign-btn");

const status=card.querySelector(".sign-status");

const url=URL.createObjectURL(file);

frame.src=url;

btn.disabled=false;

status.textContent="Ready to Sign";
status.style.color="#fbbf24";

});

});

/* SIGN BUTTON */

document.querySelectorAll(".sign-btn").forEach(btn=>{

btn.addEventListener("click",()=>{

if(!portalLoggedIn){

alert("Please login first");

return;

}

const card=btn.closest(".doc-card");

const status=card.querySelector(".sign-status");

const id=card.dataset.doc;

status.textContent="Signed ✓";

status.style.color="#4ade80";

localStorage.setItem("doc_"+id,"signed");

});

});

/* RESTORE STATUS */

window.addEventListener("DOMContentLoaded",()=>{

document.querySelectorAll(".doc-card").forEach(card=>{

const id=card.dataset.doc;

const status=card.querySelector(".sign-status");

if(localStorage.getItem("doc_"+id)==="signed"){

status.textContent="Signed ✓";

status.style.color="#4ade80";

}

});

});

</script>

</body>
</html>
